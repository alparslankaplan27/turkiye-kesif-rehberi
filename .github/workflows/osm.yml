name: Harita verisini guncelle
on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 1 * *"
permissions:
  contents: write
jobs:
  guncelle:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - name: Veriyi indir
        run: python3 osm_veri.py
      - name: Kaydet
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Harita verisi guncellendi" || echo "Degisiklik yok"
          git push
